<section style="background-image: url('https://img.freepik.com/free-vector/gradient-blur-pink-blue-abstract-background_53876-117324.jpg?semt=ais_hybrid&w=740');" class=" text-white py-20 px-6 ">
  
<div class="max-w-6xl mx-auto px-6 py-16">
    <!-- Page Title -->
    <h1 class="text-3xl font-bold text-gray-700 mb-10 text-center">
      Find Your Next Opportunity
    </h1>
  
    <!-- Search Input -->
    <div class="mb-10 flex justify-center">
      <input
        type="text"
        (input)="onInputChange($event)"
        placeholder="Search job titles, or skills..."
        class="w-full max-w-xl px-6 py-3 rounded-lg shadow-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent dark:bg-gray-800 dark:text-white"
      />
    </div>
  
    <!-- Job Results -->
    <div  class="grid gap-6">
      <!-- Job Card -->
      <div *ngFor="let offer of filtered" class="bg-white dark:bg-gray-800 shadow-md rounded-xl p-6 hover:shadow-lg transition-shadow">
        <h2 class="text-xl font-semibold text-indigo-800 dark:text-indigo-300 mb-2">{{ offer.title }}</h2>
        <p class="text-gray-600 dark:text-gray-300 mb-2">{{ offer.description }}</p>
        <ul class="text-sm text-gray-500 dark:text-gray-400 mb-4">
          <li><strong>Location:</strong> {{ offer.location }}</li>
          <li><strong>Salary:</strong> {{ offer.salary }}</li>
          <li><strong>Experience:</strong> {{ offer.experience }}</li>
        </ul>
        <button class="text-indigo-600 dark:text-indigo-300 font-medium hover:underline" (click)="applyOffer(offer.id)">Apply Now</button>
      </div>
    </div>
  </div>
  </section>
