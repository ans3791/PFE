<section class="bg-gray-100 dark:bg-gray-900 py-16 px-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white text-center mb-10">Applications</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Job Card -->
      <div *ngFor="let application of applications" class="bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-6 flex flex-col justify-between">
        <div>
          <h3 class="text-xl font-bold text-indigo-700 dark:text-indigo-400 mb-2">{{ application.job.title }}</h3>
          <h3 class="text-xl font-semibold text-indigo-500 dark:text-indigo-200 mb-2">{{ application.job.description }}</h3>
          <p class="text-gray-600 dark:text-gray-300 mb-4">{{ application.user.firstName + " " + application.user.lastName }}</p>
          <button (click)="viewProfile(application.user.id)" class="text-indigo-700 dark:text-indigo-300 font-medium hover:underline">View profile</button>
        </div>

        <!-- Action Buttons -->
        <div class="mt-4 flex space-x-4">
          <button *ngIf="application.status === JobOfferUserStatus.Pending" (click)="updateStatus(application, JobOfferUserStatus.Planned)" class="bg-blue-500 hover:bg-blue-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200 transform hover:-translate-y-1 focus:outline-none">Plan</button>
          <button *ngIf="application.status === JobOfferUserStatus.Planned" (click)="updateStatus(application, JobOfferUserStatus.Approved)" class="bg-green-500 hover:bg-green-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200 transform hover:-translate-y-1 focus:outline-none">Approve</button>
          <button *ngIf="application.status === JobOfferUserStatus.Pending || application.status === JobOfferUserStatus.Planned" (click)="updateStatus(application, JobOfferUserStatus.Rejected)" class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200 transform hover:-translate-y-1 focus:outline-none">Reject</button>
        </div>

        <!-- Status at the bottom -->
        <div class="mt-4">
          <span
            class="inline-block px-3 py-1 text-sm rounded-full"
            [ngClass]="{
              'bg-yellow-100 text-yellow-800': application.status === 0,
              'bg-blue-100 text-blue-800': application.status === 1,
              'bg-green-100 text-green-800': application.status === 2,
              'bg-red-100 text-red-800': application.status === 3
            }"
          >
            {{ getStatusLabel(application.status) }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
